<html>
 <head> 
  <meta charset="utf-8">
<style>
.button {
  background-color: #4CAF50;
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
}
</style>
 </head> 
 <body> 
  <script>
function a(){
    window.open('https://google.com', 'x');

    setTimeout(function(){
        var blob = new Blob(["hi"], { type: "text/plain" });
        var url = URL.createObjectURL(blob);

        var link = document.createElement("a");
        link.href = url;
        link.download = "hi.txt";
        link.click();

        URL.revokeObjectURL(url);
    }, 5000);
}
</script> 
  <center><h1><input type="button" class="button" value="Download" onclick="a()"></h1></center>
 </body>
</html>
