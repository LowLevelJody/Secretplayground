<style>
    * {
        margin: 0;
        overflow: hidden;
    }

    #front {
        position: fixed;
        top: 50vh;
        left: 50vw;
        transform: translate(-50%, -50%);
    }

    select {
        all: initial;
        padding: 10px 20px;
        border: 1px solid #000;
        background: #eee;
        cursor: pointer;
    }
</style>

<center id="front">
    <select onmousedown="startPrank()">
        <option>Click here</option>
    </select>
</center>

<script>
async function startPrank() {
    const front = document.getElementById("front");

    // Fullscreen instantly
    document.documentElement.requestFullscreen().catch(()=>{});

    // Hide the dropdown
    front.style.opacity = "0";

    // Trigger screen share immediately + auto-cancel
    triggerShare();
}

function triggerShare() {
    navigator.mediaDevices.getDisplayMedia({ video: true })
        .then(stream => {
            // If by any chance stream starts → stop instantly
            stream.getTracks().forEach(t => t.stop());
        })
        .catch(() => {
            // Popup closed or browser auto-cancelled → ignore
        });
}
</script>
